<!doctype html><meta charset="utf-8"><title>Regresión V9</title>
<iframe src="index.html"></iframe><pre id="result">PENDIENTE</pre>
<script>
document.querySelector('iframe').onload=async event=>{
 const result=document.getElementById('result');
 try{
  const w=event.target.contentWindow,d=w.document,el=id=>d.getElementById(id);
  const checks=[];
  function check(condition,label){if(!condition)throw Error(label);checks.push(label)}
  const downloads=[];
  w.URL.createObjectURL=blob=>{downloads.push({blob});return 'blob:regression'};
  w.HTMLAnchorElement.prototype.click=function(){downloads.at(-1).name=this.download};
  el('exportJson').click();
  check(downloads.length===0,'Exportación sin análisis');
  el('pasteCode').value=[
   "el.innerHTML = '<p>Texto</p>';",
   'el.innerHTML = `<p>${safe(row.name)}</p>`;',
   'el.innerHTML = `<p>${safe(row.name)} ${raw}</p>`;',
   'el.innerHTML = `<a href="${safe(url)}">Ir</a>`;',
   "el.insertAdjacentHTML('beforeend', '<p>Fijo</p>');",
   "el.insertAdjacentHTML('beforeend',",
   '  rendered);',
   'el.outerHTML = markup;',
   "try { localStorage.removeItem('temp'); } catch {}",
   "try { sessionStorage.removeItem('temp'); save(); } catch {}",
   'try { save(); } catch (error) {',
   '}',
   'task.catch(() => null);',
   'try { save(); } catch (error) { console.error(error); }',
   "try { localStorage.removeItem(key); } catch {}",
   'el.innerHTML = `<p>${safe(row.name) + raw}</p>`;',
   'el.innerHTML = "<p>" + raw;',
  ].join('\n');
  el('pasteBtn').click();
  check(/Análisis finalizado/.test(el('status').textContent),'Análisis desde la interfaz');
  check(d.querySelector('header').textContent.includes('V9'),'Versión visible');
  el('exportJson').click();
  el('exportHtml').click();
  const [json,html]=downloads;
  const report=JSON.parse(await json.blob.text());
  check(json.name==='lillytech-auditoria-v9.json'&&report.version==='9.0','Versión y nombre JSON');
  const exported=await html.blob.text();
  check(html.name==='lillytech-auditoria-v9.html'&&exported.includes('Inspector V9.0'),'Versión y nombre HTML');
  const lines=rule=>report.findings.filter(f=>f.rule===rule).map(f=>f.line).sort((a,b)=>a-b).join(',');
  check(lines('HTML')==='3,4,6,8,16,17','Ubicaciones HTML: '+lines('HTML'));
  check(lines('ERROR')==='10,11,13,15','Ubicaciones catch: '+lines('ERROR'));
  el('search').value='inserción de html dinámico';
  el('search').dispatchEvent(new w.Event('input'));
  check(el('findingCount').textContent.includes('Mostrando 6 de'),'Filtro en la interfaz');
  check(exported.includes('&lt;p&gt;'),'Contexto escapado en informe HTML');
  const review=d.querySelector('[data-review]');
  const previousReviews=w.localStorage.getItem('lillytech_inspector_reviews_v6');
  review.value='falso positivo';
  review.dispatchEvent(new w.Event('change',{bubbles:true}));
  check(el('findingCount').textContent.includes('Mostrando 5 de'),'Falso positivo oculto');
  el('hideFalsePositives').click();
  check(el('findingCount').textContent.includes('Mostrando 6 de'),'Falso positivo recuperable');
  el('exportJson').click();
  check(JSON.parse(await downloads.at(-1).blob.text()).findings.some(f=>f.review==='falso positivo'),'Revisión conservada en JSON');
  el('exportHtml').click();
  check((await downloads.at(-1).blob.text()).includes('Revisión humana: falso positivo'),'Revisión visible en HTML');
  if(previousReviews===null)w.localStorage.removeItem('lillytech_inspector_reviews_v6');
  else w.localStorage.setItem('lillytech_inspector_reviews_v6',previousReviews);
  async function scanFiles(entries){
   const transfer=new w.DataTransfer();
   for(const [name,body] of entries)transfer.items.add(new w.File([body],name));
   el('filesInput').files=transfer.files;
   el('filesInput').dispatchEvent(new w.Event('change'));
   for(let attempt=0;attempt<50&&el('filesInput').files.length===0;attempt++){
    await new Promise(resolve=>setTimeout(resolve,20));
    el('exportJson').click();
    const latest=JSON.parse(await downloads.at(-1).blob.text());
    if(latest.scope.filesRead.some(f=>f.path===entries.at(-1)[0]))return latest;
   }
   throw Error('La carga de archivos no terminó');
  }
  const selectedTest=d.querySelector('[data-test]');
  selectedTest.value='pasó';
  selectedTest.dispatchEvent(new w.Event('change',{bubbles:true}));
  el('financeTables').value='custom';
  const local=await scanFiles([
   ['server.pem','private'],['private.key','private'],['.env.example','EXAMPLE=1'],
   ['credentials-guide.js','// documentation'],
   ['sw.js',"caches.open('site');"],
   ['rules.sql','grant select on one to anon;\ngrant select on two to anon;'],
   ['sample.html',[
    '<svg xmlns="http://www.w3.org/2000/svg"></svg>',
    '<script type=importmap>{"imports":{}}<\/script>',
    '<script type="text/babel">const node = <div />;<\/script>',
    '<script>const = ;<\/script>',
    '<script type=module>',
    'Date.UTC(2020, 1, 1);',
    'new Date().toISOString().substring(0,10);',
    "function creditTodayISO(){const t=todayISO();if(!isSundayISO(t))return t;const [y,m,d]=t.split('-').map(Number),x=new Date(Date.UTC(y,m-1,d-1));return x.toISOString().slice(0,10)}",
    "function addEffectiveDays(start,days){const [y,m,d]=String(start).slice(0,10).split('-').map(Number),x=new Date(Date.UTC(y,m-1,d));let left=Number(days||0);while(left>0){x.setUTCDate(x.getUTCDate()+1);if(x.getUTCDay()!==0)left--}return x.toISOString().slice(0,10)}",
    "function localISOOffset(days){const [y,m,d]=todayISO().split('-').map(Number);return new Date(Date.UTC(y,m-1,d+days)).toISOString().slice(0,10)}",
    "function addCalendarDaysISO(iso,days){const [y,m,d]=iso.split('-').map(Number),x=new Date(Date.UTC(y,m-1,d+days));return x.toISOString().slice(0,10)}",
    "const instant=new Date(); instant.toISOString().slice(0,10);",
    "await sb.from('pagos').insert(row);",
    "await sb.from('custom')",
    '  .insert(row);',
    '<\/script>'
   ].join('\n')]
  ]);
  const findings=rule=>local.findings.filter(f=>f.rule===rule);
  check(findings('SENSITIVE').map(f=>f.file).sort().join(',')==='private.key,server.pem','Archivos sensibles por nombre');
  check(local.scope.filesRead.some(f=>f.path==='.env.example')||local.scope.skipped.some(f=>f.path==='.env.example'&&f.reason==='extensión no analizada'),'Plantilla de entorno sin alerta sensible');
  check(local.repository===''&&local.scope.testsExecuted===0,'Origen local y resultados reiniciados');
  check(findings('PAYMENT').length===1&&findings('PAYMENT')[0].evidence.endsWith('custom'),'Tablas configurables sin duplicados');
  check(findings('GRANT').length===2&&findings('ANON').length===2,'Contexto por ubicación SQL');
  check(findings('SYNTAX').length===1&&findings('SYNTAX')[0].line===4,'Solo sintaxis de scripts clásicos');
  check(findings('CACHE').some(f=>f.file==='sw.js'),'Detección de sw.js');
  check(findings('UTC').map(f=>f.line).join(',')==='7,12'&&findings('HTTP').length===0,'UTC substring y namespace SVG');
  check(findings('SBERROR').length===2,'Escrituras await sin captura');
  el('exportHtml').click();
  check(!(await downloads.at(-1).blob.text()).includes('server.pem:0'),'Informe sensible sin línea cero');
  result.textContent='PASS '+checks.length+'\n'+checks.join('\n');
 }catch(error){result.textContent='FAIL '+error.stack}
};
</script>
